name: APK Derle

# Kod her güncellendiğinde (ya da Actions sekmesinden elle) APK derlenir
# ve "Releases" bölümüne indirilebilir dosya olarak konur.
on:
  push:
    branches: [main]
    # Günlük deneme içerikleri yeni sürüm derlemez
    paths-ignore:
      - 'icerik/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  # İmza anahtarının şifresi: Settings → Secrets and variables → Actions
  EGITIM_KEYSTORE_PASSWORD: ${{ secrets.EGITIM_KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: flutter create --platforms=android --org com.egitimtakip --project-name egitim_takip .

      - name: Android ayarları (minSdk 24, uygulama adı, izinler, imza anahtarı)
        run: |
          if [ -z "$EGITIM_KEYSTORE_PASSWORD" ]; then
            echo "::error::EGITIM_KEYSTORE_PASSWORD gizli ayarı eksik. GitHub → Settings → Secrets and variables → Actions bölümünden ekleyin."
            exit 1
          fi
          python3 ci/android_ayarla.py .
          grep -n "minSdk\|Desugaring\|keystore" android/app/build.gradle* || true

      - name: Paketleri güncelle
        # Bildirim paketi sabit ana sürümde tutulur (kod onun API'sine göre yazıldı).
        run: flutter pub upgrade --major-versions firebase_core firebase_auth cloud_firestore flutter_lints

      - name: Testler
        run: flutter test

      - name: APK derle
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/egitim-takip.apk

      - name: İmza kontrolü (güncellemeler eskisinin üzerine kurulabilsin)
        run: python3 ci/imza_kontrol.py build/app/outputs/flutter-apk/egitim-takip.apk ci/egitim-takip.p12

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Eğitim Takip - Sürüm ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Telefona ilk kez kurmak için aşağıdaki egitim-takip.apk dosyasına dokunun. Uygulama kuruluysa güncelleme uygulamanın içinden gelir.
          files: build/app/outputs/flutter-apk/egitim-takip.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
