name: APK Derle

# Kod her güncellendiğinde (ya da Actions sekmesinden elle) APK derlenir
# ve "Releases" bölümüne indirilebilir dosya olarak konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: flutter create --platforms=android --org com.egitimtakip --project-name egitim_takip .

      - name: Android ayarları (minSdk 24, uygulama adı, bildirim izinleri, imza anahtarı)
        run: |
          python3 ci/android_ayarla.py .
          grep -n "minSdk\|Desugaring\|keystore" android/app/build.gradle* || true

      - name: Paketleri güncelle
        # Bildirim paketi sabit ana sürümde tutulur (kod onun API'sine göre yazıldı).
        run: flutter pub upgrade --major-versions firebase_core firebase_auth cloud_firestore flutter_lints

      - name: Testler
        run: flutter test

      - name: APK derle
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/egitim-takip.apk

      - name: İmza kontrolü (güncellemeler eskisinin üzerine kurulabilsin)
        run: python3 ci/imza_kontrol.py build/app/outputs/flutter-apk/egitim-takip.apk ci/debug.keystore

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Eğitim Takip - Sürüm ${{ github.run_number }}
          body: |
            Telefona kurmak için aşağıdaki **egitim-takip.apk** dosyasına dokunun.
          files: build/app/outputs/flutter-apk/egitim-takip.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
