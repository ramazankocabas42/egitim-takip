name: egitim_takip
description: "Çocukların ödev, kitap okuma, test kitabı ve deneme takibini yapan uygulama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  intl: any
  flutter_local_notifications: ^22.3.0
  timezone: any
  mobile_scanner: ^7.1.0
  http: ^1.2.0
  ota_update: ^7.1.0
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^1.0.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/kitaplar.json
    - assets/meb_kitaplari.json
